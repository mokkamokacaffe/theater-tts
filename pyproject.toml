[project]
name = "theater-tts"
version = "0.1.0"
description = "Local desktop application for generating multi-speaker theater audio with ElevenLabs"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.11,<7",
  "elevenlabs>=2.69,<3",
  "python-dotenv>=1.0,<2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
